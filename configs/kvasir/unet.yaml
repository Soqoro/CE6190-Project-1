dataset: kvasir
root: data/kvasir
split_file: splits/kvasir/seed0_20.json  # change to seedX_Y.json as needed

family: unet
encoder: resnet34
num_classes: 1
pretrained: true
model_kwargs: {}

image_size: 384
batch_size: 8
workers: 4

lr: 3.0e-4
wd: 5.0e-4

max_steps: 20000
eval_every_steps: 500
patience: 10
min_delta: 0.001
# monitor auto-set: val/dice for binary

out_dir: runs/kvasir_unet
gpus: 1
